<section class="admin-page">
  <header class="admin-page__header">
    <div>
      <h1 class="admin-page__title">Quản lý hãng sản xuất</h1>
      <p class="admin-page__subtitle">Cập nhật thông tin thương hiệu và logo hiển thị.</p>
    </div>
    <app-base-button variant="primary" icon="plus" (clicked)="openAdd()">Thêm hãng mới</app-base-button>
  </header>

  <app-filter-bar title="Bộ lọc" subtitle="Tìm theo tên thương hiệu.">
    <div filter-fields>
      <app-base-input
        label="Tên hãng"
        placeholder="Nhập tên hãng"
        [value]="searchTerm"
        (valueChange)="searchTerm = $event">
      </app-base-input>
    </div>
  </app-filter-bar>

  <app-base-table title="Danh sách hãng" subtitle="{{ filteredBrands.length }} hãng hiển thị.">
    <div class="table-responsive">
      <table class="admin-table">
        <thead>
          <tr>
            <th class="logo-col">Logo</th>
            <th>Tên hãng</th>
            <th class="text-right">Thao tác</th>
          </tr>
        </thead>
        <tbody>
          @for (brand of filteredBrands; track brand.id) {
            <tr>
              <td>
                <div class="brand-logo-wrap">
                  <img [src]="brand.imageUrl || 'https://via.placeholder.com/40'" alt="{{ brand.name }}" />
                </div>
              </td>
              <td><span class="brand-name">{{ brand.name }}</span></td>
              <td class="text-right">
                <div class="action-btns">
                  <app-base-button variant="ghost" icon="edit" (clicked)="openEdit(brand)">Sửa</app-base-button>
                  <app-base-button variant="danger" icon="trash" (clicked)="delete(brand.id)">Xóa</app-base-button>
                </div>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="3" class="empty-cell">Không có hãng sản xuất phù hợp.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </app-base-table>
</section>

<app-brand-modal
  [isOpen]="isModalOpen"
  [isSaving]="isSaving"
  [brand]="selectedBrand"
  (save)="save($event)"
  (cancel)="closeModal()">
</app-brand-modal>

<app-confirm-modal
  [isOpen]="isDeleteModalOpen"
  title="Xóa hãng sản xuất"
  message="Bạn có chắc chắn muốn xóa hãng sản xuất này? Hành động này không thể hoàn tác."
  [confirmVariant]="'danger'"
  (confirm)="confirmDelete()"
  (cancel)="closeDeleteModal()"
></app-confirm-modal>
