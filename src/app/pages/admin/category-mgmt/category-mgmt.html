<div class="dashboard">
  <div class="dashboard__header" style="display:flex;justify-content:space-between;align-items:flex-end;">
    <div>
      <h1 class="dashboard__title">Quản lý Danh mục</h1>
      <p class="dashboard__subtitle">Thêm, sửa, xóa danh mục sản phẩm</p>
    </div>
    <button class="btn btn--primary" (click)="openAdd()">+ Thêm danh mục</button>
  </div>

  <div class="content-panel">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Tên danh mục</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody>
          @for (cat of categories; track cat.id) {
            <tr>
              <td>{{ cat.id }}</td>
              <td>{{ cat.name }}</td>
              <td>
                <button (click)="openEdit(cat)" class="action-btn-edit">Sửa</button>
                <button (click)="delete(cat.id)" class="action-btn-delete">Xóa</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div *ngIf="isModalOpen" class="modal-overlay">
  <div class="modal-container modal-container--sm">
    <div class="modal-header">
      <h2 class="modal-header__title">{{ isEditing ? 'Sửa' : 'Thêm' }} Danh mục</h2>
      <button class="modal-header__close" (click)="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-group__label">Tên danh mục <span class="text-error">*</span></label>
        <input [(ngModel)]="selectedCategory.name" class="form-group__input" placeholder="VD: Laptop, Điện thoại..." />
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn--secondary" (click)="closeModal()">Hủy</button>
      <button class="btn btn--primary" (click)="save()">Lưu</button>
    </div>
  </div>
</div>
