<section class="admin-page">
  <header class="admin-page__header">
    <div>
      <h1 class="admin-page__title">Quản lý đơn hàng</h1>
      <p class="admin-page__subtitle">Theo dõi trạng thái, điều phối nhân viên giao hàng và xử lý nhanh theo bộ lọc.</p>
    </div>
  </header>

  <app-filter-bar title="Bộ lọc đơn hàng" subtitle="Lọc theo trạng thái, nhân viên giao hàng và ngày tạo.">
    <div class="order-filter-grid" filter-fields>
      <app-base-select
        label="Trạng thái"
        [value]="selectedStatus()"
        [options]="statusOptions"
        (valueChange)="onStatusChanged($event)">
      </app-base-select>

      <app-base-input
        label="Ngày tạo"
        type="date"
        [value]="selectedDate()"
        (valueChange)="onDateChanged($event)">
      </app-base-input>

      <app-base-select
        label="Nhân viên giao hàng"
        [value]="selectedShipperId()"
        [options]="shipperOptions()"
        (valueChange)="onShipperChanged($event)">
      </app-base-select>
    </div>

    <div class="status-tabs" filter-actions role="tablist" aria-label="Lọc trạng thái đơn giao">
      @for (option of statusOptions; track option.value) {
        <button
          type="button"
          class="status-tab"
          [class.status-tab--active]="selectedStatus() === option.value"
          (click)="onStatusChanged(option.value)">
          <span>{{ option.label }}</span>
          <span class="status-tab__count">{{ countByStatus(option.value) }}</span>
        </button>
      }
    </div>

    <div filter-actions>
      <button class="reset-filter-button" type="button" (click)="resetFilters()">Đặt lại bộ lọc</button>
    </div>
  </app-filter-bar>

  <app-base-table title="Danh sách đơn hàng" subtitle="{{ orderCount() }} đơn hàng trong kết quả lọc.">
    <app-order-table
      [orders]="filteredOrders()"
      [role]="'ROLE_ADMIN'"
      [loadingAction]="loadingAction()"
      [shippers]="shippers()"
      (action)="handleAction($event)">
    </app-order-table>
  </app-base-table>
</section>
