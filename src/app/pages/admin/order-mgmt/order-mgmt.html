<div class="page">
  <div class="page-header">
    <div>
      <h1>Quản lý đơn hàng</h1>
      <p>Admin chỉ xem và lọc đơn hàng theo trạng thái, shipper và ngày tạo.</p>
    </div>

    <div class="filters">
      <select [ngModel]="selectedStatus()" (ngModelChange)="selectedStatus.set($event); reload()">
        <option value="ALL">Tất cả trạng thái</option>
        <option value="CREATED">CREATED</option>
        <option value="PROCESSING">PROCESSING</option>
        <option value="READY_FOR_SHIPPING">READY_FOR_SHIPPING</option>
        <option value="SHIPPING">SHIPPING</option>
        <option value="DELIVERED">DELIVERED</option>
        <option value="DELIVERY_FAILED">DELIVERY_FAILED</option>
        <option value="CANCELLED">CANCELLED</option>
      </select>

      <select [ngModel]="selectedShipperId()" (ngModelChange)="selectedShipperId.set($event); reload()">
        <option value="ALL">Tất cả shipper</option>
        @for (shipper of shippers(); track shipper.id) {
          <option [ngValue]="shipper.id">{{ shipper.fullName }}</option>
        }
      </select>

      <input type="date" [ngModel]="selectedDate()" (ngModelChange)="selectedDate.set($event); reload()">
    </div>
  </div>

  <app-order-table
    [orders]="orders()"
    [role]="'ROLE_ADMIN'"
    [loadingAction]="loadingAction()"
    (action)="handleAction($event)">
  </app-order-table>
</div>
