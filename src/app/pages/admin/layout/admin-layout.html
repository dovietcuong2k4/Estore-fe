<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="admin-sidebar__header">
      <a routerLink="/admin" class="admin-logo">
        <span class="admin-logo__icon"><app-icon name="bolt" size="24"></app-icon></span>
        <span class="admin-logo__text">E-Store Quản trị</span>
      </a>
    </div>

    <nav class="admin-nav">
      <div class="admin-nav__group">
        <span class="admin-nav__label">Tổng quan</span>
        <a routerLink="/admin/dashboard" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="pie-chart" size="18" className="nav-icon"></app-icon> Bảng điều khiển
        </a>
      </div>

      <div class="admin-nav__group">
        <span class="admin-nav__label">Quản lý bán hàng</span>
        <a routerLink="/admin/orders" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="package" size="18" className="nav-icon"></app-icon> Đơn hàng
        </a>
        <a routerLink="/admin/products" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="shopping-bag" size="18" className="nav-icon"></app-icon> Sản phẩm
        </a>
        <a routerLink="/admin/categories" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="folder" size="18" className="nav-icon"></app-icon> Danh mục
        </a>
        <a routerLink="/admin/brands" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="tag" size="18" className="nav-icon"></app-icon> Hãng sản xuất
        </a>
        <a routerLink="/admin/vouchers" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="ticket" size="18" className="nav-icon"></app-icon> Voucher
        </a>
      </div>

      <div class="admin-nav__group">
        <span class="admin-nav__label">Quản lý hệ thống</span>
        <a routerLink="/admin/profile" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="user" size="18" className="nav-icon"></app-icon> Thông tin cá nhân
        </a>
        <a routerLink="/admin/users" routerLinkActive="active" class="admin-nav__link">
          <app-icon name="users" size="18" className="nav-icon"></app-icon> Người dùng
        </a>
      </div>
    </nav>

    <div class="admin-sidebar__footer">
      <div class="admin-user">
        <div class="admin-user__avatar">
          {{ auth.user()?.fullName?.charAt(0) }}
        </div>
        <div class="admin-user__info">
          <div class="admin-user__name">{{ auth.user()?.fullName }}</div>
          <div class="admin-user__role">{{ auth.user()?.roles?.[0]?.name }}</div>
        </div>
      </div>
      <button (click)="auth.logout()" class="btn-store">
        <app-icon name="log-out" size="18"></app-icon> Đăng xuất
      </button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
