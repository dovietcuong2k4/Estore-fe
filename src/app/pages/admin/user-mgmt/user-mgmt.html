<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Quản lý Người dùng</h1>
    <p class="dashboard__subtitle">Tất cả tài khoản trên hệ thống</p>
  </div>

  <div class="content-panel">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Họ Tên</th>
            <th>Email</th>
            <th>Điện thoại</th>
            <th>Vai trò</th>
          </tr>
        </thead>
        <tbody>
          @for (user of users; track user.id) {
            <tr>
              <td>{{ user.id }}</td>
              <td style="font-weight: 500;">{{ user.fullName }}</td>
              <td>{{ user.email }}</td>
              <td>{{ user.phone || 'N/A' }}</td>
              <td>
                @for (role of user.roles; track role.id) {
                  <span class="badge" style="background: rgba(129,140,248,0.15); color: #818cf8; margin-right: 0.25rem;">{{ role.name }}</span>
                }
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
