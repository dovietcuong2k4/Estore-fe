<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <div class="auth-card__logo">
        <span class="auth-card__logo-icon"><app-icon name="bolt" size="28"></app-icon></span>
        <span class="auth-card__logo-text">E-Store</span>
      </div>
      <h1 class="auth-card__title">Đăng nhập</h1>
      <p class="auth-card__subtitle">Chào mừng bạn quay lại hệ thống</p>
    </div>

    @if (error()) {
      <div class="auth-card__error">{{ error() }}</div>
    }

    <form class="auth-form" (ngSubmit)="login()">
      <div class="auth-form__group">
        <label class="auth-form__label">Email</label>
        <input type="email" class="auth-form__input" [(ngModel)]="email" name="email" placeholder="Nhập email của bạn" required />
      </div>

      <div class="auth-form__group">
        <div class="auth-form__label-row">
          <label class="auth-form__label">Mật khẩu</label>
          <a href="#" class="auth-form__forgot">Quên mật khẩu?</a>
        </div>
        <input type="password" class="auth-form__input" [(ngModel)]="password" name="password" placeholder="Nhập mật khẩu" required />
      </div>

      <button type="submit" class="auth-form__btn">
        <app-icon name="log-in" size="18"></app-icon> {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
      </button>
    </form>
    
    <div class="auth-card__footer">
      <span>Chưa có tài khoản?</span>
      <a routerLink="/register">Đăng ký ngay</a>
    </div>
  </div>
</div>
