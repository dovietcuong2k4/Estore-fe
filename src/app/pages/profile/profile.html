<section class="profile-page">
  <div class="profile-page__container">
    <header class="profile-head">
      <div>
        <h1 class="profile-head__title">Thông tin cá nhân</h1>
        <p class="profile-head__description">Quản lý thông tin cá nhân của bạn</p>
      </div>

      <div class="profile-head__actions">
        @if (!editMode() && hasEditableFields()) {
          <button class="kv-primary-btn" type="button" (click)="startEdit()">Chỉnh sửa</button>
        }

        @if (editMode()) {
          <button class="kv-secondary-btn" type="button" (click)="cancelEdit()" [disabled]="submitting()">Hủy</button>
          <button class="kv-primary-btn" type="button" (click)="saveProfile()" [disabled]="submitting()">
            @if (submitting()) { Đang lưu... } @else { Lưu }
          </button>
        }
      </div>
    </header>

    @if (loading()) {
      <div class="profile-state profile-state--loading">Đang tải thông tin cá nhân...</div>
    } @else if (error()) {
      <div class="profile-state profile-state--error">{{ error() }}</div>
    } @else if (profileData()) {
      <div class="profile-grid">
        <article class="profile-card profile-card--main">
          <app-profile-dynamic-form
            [fields]="sortedFields()"
            [values]="draftValues()"
            [editMode]="editMode()"
            [submitted]="submitted()"
            (valueChanged)="onFieldChanged($event)">
          </app-profile-dynamic-form>
        </article>
      </div>
    }
  </div>
</section>
