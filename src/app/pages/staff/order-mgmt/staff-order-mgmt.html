<div class="p-6">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
    <div>
      <h1 class="text-2xl font-bold text-gray-800">Quản lý đơn hàng</h1>
      <p class="text-gray-500 mt-1">Xử lý xác nhận, chuẩn bị, sẵn sàng giao và phân công shipper.</p>
    </div>

    <div class="flex items-center space-x-2">
      <label class="text-sm font-medium text-gray-600">Trạng thái:</label>
      <select 
        class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2 shadow-sm outline-none"
        [ngModel]="selectedStatus()" 
        (ngModelChange)="selectedStatus.set($event)">
        <option value="ALL">Tất cả</option>
        <option value="CREATED">CREATED</option>
        <option value="PENDING">PENDING</option>
        <option value="CONFIRMED">CONFIRMED</option>
        <option value="PREPARING">PREPARING</option>
        <option value="READY_FOR_SHIPPING">READY_FOR_SHIPPING</option>
      </select>
    </div>
  </div>

  <app-order-table
    [orders]="filteredOrders()"
    [role]="'ROLE_STAFF'"
    [shippers]="shippers()"
    [loadingAction]="loadingAction()"
    (action)="handleAction($event)">
  </app-order-table>
</div>
