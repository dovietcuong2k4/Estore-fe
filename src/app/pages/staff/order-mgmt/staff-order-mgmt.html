<section class="admin-page">
  <header class="admin-page__header">
    <div>
      <h1 class="admin-page__title">Quản lý đơn hàng</h1>
      <p class="admin-page__subtitle">Xử lý đơn, chuyển trạng thái, hủy đơn và phân công nhân viên giao hàng trong một không gian làm việc tập trung.</p>
    </div>
  </header>

  <app-filter-bar title="Bộ lọc đơn hàng" subtitle="Lọc theo trạng thái, nhân viên giao hàng và ngày tạo.">
    <div class="order-filter-grid" filter-fields>
      <app-base-select
        label="Trạng thái"
        [options]="statusOptions"
        [value]="selectedStatus()"
        (valueChange)="setStatus($event)">
      </app-base-select>

      <app-base-input
        label="Ngày tạo"
        type="date"
        [value]="selectedDate()"
        (valueChange)="setDate($event)">
      </app-base-input>

      <app-base-select
        label="Nhân viên giao hàng"
        [options]="shipperOptions()"
        [value]="selectedShipperId()"
        (valueChange)="setShipper($event)">
      </app-base-select>
    </div>

    <div class="status-tabs" filter-actions role="tablist" aria-label="Lọc trạng thái đơn giao">
      @for (option of statusOptions; track option.value) {
        <button
          type="button"
          class="status-tab"
          [class.status-tab--active]="selectedStatus() === option.value"
          (click)="setStatus(option.value)">
          <span>{{ option.label }}</span>
          <span class="status-tab__count">{{ countByStatus(option.value) }}</span>
        </button>
      }
    </div>

    <div filter-actions>
      <app-base-button variant="ghost" type="button" (clicked)="resetFilters()">Đặt lại bộ lọc</app-base-button>
    </div>
  </app-filter-bar>

  <app-base-table title="Danh sách đơn hàng" subtitle="{{ orderCount() }} đơn hàng trong kết quả lọc.">
    <app-order-table
      [orders]="filteredOrders()"
      [role]="'ROLE_STAFF'"
      [shippers]="shippers()"
      [loadingAction]="loadingAction()"
      (action)="handleAction($event)">
    </app-order-table>
  </app-base-table>
</section>
