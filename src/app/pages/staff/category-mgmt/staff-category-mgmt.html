<div class="dashboard">
  <div class="dashboard__header">
    <h1 class="dashboard__title">Danh sách Danh mục</h1>
    <p class="dashboard__subtitle">Xem danh sách các danh mục sản phẩm trong hệ thống (Quyền Read-only)</p>
  </div>

  <div class="content-panel">
    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>#</th>
            <th>Tên danh mục</th>
          </tr>
        </thead>
        <tbody>
          @for (cat of categories; track cat.id) {
            <tr>
              <td>{{ cat.id }}</td>
              <td>{{ cat.name }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
