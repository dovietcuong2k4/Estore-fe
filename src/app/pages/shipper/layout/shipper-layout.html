<div class="shipper-layout">
  <aside class="shipper-sidebar">
    <div class="shipper-sidebar__header">
      <a routerLink="/shipper" class="shipper-logo">
        <span class="shipper-logo__icon"><app-icon name="truck" size="24"></app-icon></span>
        <span class="shipper-logo__text">E-Store Giao hàng</span>
      </a>
    </div>

    <nav class="shipper-nav">
      <div class="shipper-nav__group">
        <span class="shipper-nav__label">Giao hàng</span>
        <a routerLink="/shipper/profile" routerLinkActive="active" class="shipper-nav__link">
          <span class="icon"><app-icon name="user" size="20"></app-icon></span> Thông tin cá nhân
        </a>
        <a routerLink="/shipper/orders" routerLinkActive="active" class="shipper-nav__link">
          <span class="icon"><app-icon name="package" size="20"></app-icon></span> Quản lý Đơn giao
        </a>
      </div>
    </nav>

    <div class="shipper-sidebar__footer">
      <div class="shipper-user">
        <div class="shipper-user__avatar">
          {{ auth.user()?.fullName?.charAt(0) }}
        </div>
        <div class="shipper-user__info">
          <div class="shipper-user__name">{{ auth.user()?.fullName }}</div>
          <div class="shipper-user__role">Nhân viên giao hàng</div>
        </div>
      </div>
      <button (click)="auth.logout()" class="btn-store"><app-icon name="log-out" size="16"></app-icon> Đăng xuất</button>
    </div>
  </aside>

  <main class="shipper-main">
    <div class="shipper-content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
