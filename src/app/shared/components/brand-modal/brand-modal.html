<div *ngIf="isOpen" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm transition-opacity">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-md mx-4 overflow-hidden animate-fade-in-up">
    <!-- Header -->
    <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
      <h2 class="text-xl font-semibold text-gray-800">{{ isEditing ? 'Cập nhật' : 'Thêm' }} Hãng Sản Xuất</h2>
      <button (click)="onCancel()" class="text-gray-400 hover:text-gray-600 focus:outline-none transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    
    <!-- Body -->
    <div class="p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tên hãng <span class="text-red-500">*</span></label>
        <input [(ngModel)]="localData.name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-sm" placeholder="VD: Apple, Samsung..." [disabled]="isSaving" />
        <p *ngIf="validationError" class="text-sm text-red-500 mt-1">{{ validationError }}</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Logo URL</label>
        <input [(ngModel)]="localData.imageUrl" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-sm" placeholder="https://..." [disabled]="isSaving" />
        
        <!-- Live Preview -->
        <div *ngIf="localData.imageUrl" class="mt-3 bg-gray-50 rounded-lg p-2 border border-dashed border-gray-300 flex justify-center">
           <img [src]="localData.imageUrl" class="h-16 w-auto object-contain rounded" (error)="onImageError()" />
        </div>
      </div>
    </div>
    
    <!-- Footer -->
    <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl border-t border-gray-100">
      <button (click)="onCancel()" [disabled]="isSaving" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-50 transition-all font-medium shadow-sm">
        Hủy
      </button>
      <button (click)="onSubmit()" [disabled]="isSaving" class="flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 shadow-md transition-all font-medium">
        <svg *ngIf="isSaving" class="animate-spin h-4 w-4 mr-2 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span *ngIf="!isSaving"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4 inline-block mr-1"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg></span>
        {{ isSaving ? 'Đang lưu...' : 'Lưu lại' }}
      </button>
    </div>
  </div>
</div>
