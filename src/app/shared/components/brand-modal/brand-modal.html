@if (isOpen) {
  <div class="modal-backdrop" (click)="onCancel()">
    <section class="modal-shell" (click)="$event.stopPropagation()">
      <header class="modal-shell__header">
        <div>
          <p class="modal-shell__eyebrow">Danh mục</p>
          <h2 class="modal-shell__title">{{ modalTitle }}</h2>
          <p class="modal-shell__subtitle">{{ isEditing ? 'Chỉnh sửa thông tin hãng sản xuất hiện có.' : 'Tạo một hãng sản xuất mới cho danh mục sản phẩm.' }}</p>
        </div>
        <button type="button" class="modal-shell__close" (click)="onCancel()" aria-label="Đóng hộp thoại">×</button>
      </header>

      <div class="modal-shell__body brand-modal__body">
        <div class="brand-modal__field">
          <app-base-input
            label="Tên hãng"
            placeholder="VD: Apple, Samsung..."
            [required]="true"
            [disabled]="isSaving"
            [value]="localData.name"
            (valueChange)="setName($event)">
          </app-base-input>
          @if (validationError) {
            <p class="brand-modal__error">{{ validationError }}</p>
          }
        </div>

        <app-base-input
          label="Đường dẫn logo"
          placeholder="https://..."
          [disabled]="isSaving"
          [value]="localData.imageUrl"
          (valueChange)="setImageUrl($event)">
        </app-base-input>

        @if (localData.imageUrl) {
          <div class="brand-modal__preview">
            <img [src]="localData.imageUrl" [alt]="localData.name || 'Ảnh xem trước hãng'" (error)="onImageError()" />
          </div>
        }
      </div>

      <footer class="modal-shell__footer">
        <app-base-button variant="ghost" type="button" [disabled]="isSaving" (clicked)="onCancel()">Hủy</app-base-button>
        <app-base-button type="button" [disabled]="isSaving" (clicked)="onSubmit()">
          {{ isSaving ? 'Đang lưu...' : 'Lưu lại' }}
        </app-base-button>
      </footer>
    </section>
  </div>
}
