@if (isOpen) {
  <div class="modal-backdrop" (click)="onCancel()">
    <section class="modal-shell" (click)="$event.stopPropagation()">
      <header class="modal-shell__header">
        <div>
          <p class="modal-shell__eyebrow">Danh mục</p>
          <h2 class="modal-shell__title">{{ modalTitle }}</h2>
          <p class="modal-shell__subtitle">{{ isEditing ? 'Chỉnh sửa thông tin danh mục hiện có.' : 'Tạo một danh mục mới cho hệ thống.' }}</p>
        </div>
        <button type="button" class="modal-shell__close" (click)="onCancel()" aria-label="Đóng hộp thoại">×</button>
      </header>

      <div class="modal-shell__body category-modal__body">
        <div class="category-modal__field">
          <app-base-input
            label="Tên danh mục"
            placeholder="VD: Điện thoại, Laptop..."
            [required]="true"
            [disabled]="isSaving"
            [value]="localData.name"
            (valueChange)="setName($event)">
          </app-base-input>
          @if (validationError) {
            <p class="category-modal__error">{{ validationError }}</p>
          }
        </div>

        <app-base-input
          label="Đường dẫn biểu tượng"
          placeholder="https://..."
          [disabled]="isSaving"
          [value]="localData.iconUrl"
          (valueChange)="setIconUrl($event)">
        </app-base-input>

        @if (localData.iconUrl) {
          <div class="category-modal__preview">
            <img [src]="localData.iconUrl" [alt]="localData.name || 'Ảnh xem trước danh mục'" (error)="onImageError()" />
          </div>
        }
      </div>

      <footer class="modal-shell__footer">
        <app-base-button variant="ghost" type="button" [disabled]="isSaving" (clicked)="onCancel()">Hủy</app-base-button>
        <app-base-button type="button" [disabled]="isSaving" (clicked)="onSubmit()">
          {{ isSaving ? 'Đang lưu...' : 'Lưu lại' }}
        </app-base-button>
      </footer>
    </section>
  </div>
}
