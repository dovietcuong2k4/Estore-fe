<div class="flex flex-col gap-2" *ngIf="buttons().length > 0; else noActions">
  @for (button of buttons(); track button.type) {
    <button
      type="button"
      class="px-3 py-1.5 rounded-lg text-sm font-medium transition-all w-full text-center"
      [ngClass]="{
        'bg-blue-600 text-white shadow-sm hover:bg-blue-700': button.enabled && button.type !== 'cancel' && button.type !== 'fail',
        'bg-red-600 text-white shadow-sm hover:bg-red-700': button.enabled && (button.type === 'cancel' || button.type === 'fail'),
        'bg-gray-100 text-gray-400 cursor-not-allowed': !button.enabled
      }"
      [disabled]="!button.enabled || isLoading(button.type)"
      (click)="openModal(button.type)">
      <span class="flex items-center justify-center">
        <svg *ngIf="isLoading(button.type)" class="animate-spin h-3.5 w-3.5 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        {{ isLoading(button.type) ? 'Đang xử lý...' : button.label }}
      </span>
    </button>
  }
</div>

<ng-template #noActions>
  <span class="text-gray-400 italic text-sm">Chỉ xem</span>
</ng-template>

<div *ngIf="modalAction()" class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 backdrop-blur-sm transition-opacity" (click)="closeModal()">
  <div class="bg-white rounded-xl shadow-lg w-full max-w-sm mx-4 overflow-hidden animate-fade-in-up" (click)="$event.stopPropagation()">
    <div class="px-6 py-4 border-b border-gray-100">
      <h3 class="text-xl font-semibold text-gray-800">{{ modalTitle(modalAction()) }}</h3>
    </div>
    
    <div class="p-6">
      <p class="text-gray-600 text-sm mb-4">{{ modalMessage(modalAction()) }}</p>

      <div class="" *ngIf="modalAction() === 'assign-shipper'">
        <label for="shipper-select" class="block text-sm font-medium text-gray-700 mb-1">Chọn Shipper</label>
        <select id="shipper-select" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-sm bg-white" [ngModel]="selectedShipperId()" (ngModelChange)="selectedShipperId.set($event)">
          <option [ngValue]="null">-- Chọn shipper --</option>
          @for (shipper of shippers(); track shipper.id) {
            <option [ngValue]="shipper.id">{{ shipper.fullName }} - #{{ shipper.id }}</option>
          }
        </select>
      </div>
    </div>

    <div class="px-6 py-4 bg-gray-50 flex justify-end space-x-3 rounded-b-xl border-t border-gray-100">
      <button type="button" class="px-4 py-2 text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-100 disabled:opacity-50 transition-all font-medium shadow-sm" (click)="closeModal()">Đóng</button>
      <button
        type="button"
        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:opacity-50 shadow-md transition-all font-medium"
        [disabled]="modalAction() === 'assign-shipper' && !selectedShipperId()"
        (click)="submitAction()">
        Xác nhận
      </button>
    </div>
  </div>
</div>
