<div class="row-actions" *ngIf="buttons().length > 0; else noActions">
  @for (button of buttons(); track button.type) {
    <app-base-button
      [variant]="(button.type === 'cancel' || button.type === 'fail') ? 'danger' : 'ghost'"
      [disabled]="!button.enabled || isLoading(button.type)"
      [icon]="isLoading(button.type) ? null : button.icon"
      (clicked)="openModal(button.type)">
      @if (isLoading(button.type)) {
        <span class="flex items-center">
          <svg class="animate-spin h-3.5 w-3.5 mr-1.5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Đang xử lý...
        </span>
      } @else {
        {{ button.label }}
      }
    </app-base-button>
  }
</div>

<ng-template #noActions>
  <span class="text-gray-400 italic text-sm">Chỉ xem</span>
</ng-template>

<app-base-modal
  [open]="!!modalAction()"
  [title]="modalTitle(modalAction())"
  [subtitle]="modalMessage(modalAction())"
  (close)="closeModal()">
  
  <div modal-body *ngIf="modalAction() === 'assign-shipper'">
    <div class="shipper-selection">
      <label class="selection-label">Chọn nhân viên giao hàng</label>
      <select 
        class="selection-control" 
        [ngModel]="selectedShipperId()" 
        (ngModelChange)="selectedShipperId.set($event)">
        <option [ngValue]="null">-- Chọn nhân viên giao hàng --</option>
        @for (shipper of shippers(); track shipper.id) {
          <option [ngValue]="shipper.id">{{ shipper.fullName }} - #{{ shipper.id }}</option>
        }
      </select>
    </div>
  </div>

  <div modal-footer>
    <app-base-button variant="ghost" (clicked)="closeModal()">Đóng</app-base-button>
    <app-base-button 
      [disabled]="modalAction() === 'assign-shipper' && !selectedShipperId()"
      (clicked)="submitAction()">
      Xác nhận
    </app-base-button>
  </div>
</app-base-modal>
